<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EBL Public Profile</title>
<style>
:root{--bg:#040b14;--navy:#071426;--navy2:#0d2138;--panel:#0a1b2e;--panel2:#102844;--line:#29445f;--gold:#d4af37;--gold2:#e2c46a;--white:#f7f9fc;--muted:#9aa8b7;--green:#58c98b;--red:#d7262e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#173556 0,#091a2e 35%,#040b14 72%);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button{font:inherit}.shell{max-width:1240px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0 20px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:white}.brandMark{width:58px;height:58px;border-radius:16px;border:2px solid var(--gold);display:grid;place-items:center;background:linear-gradient(180deg,#102844,#071426);font-weight:1000;letter-spacing:.04em;box-shadow:inset 0 0 0 4px #071426,0 5px 14px #0009}.brandText b{display:block;letter-spacing:.16em;font-size:14px}.brandText span{display:block;color:var(--gold2);font-size:10px;letter-spacing:.2em;margin-top:3px}.homeBtn,.actionBtn{border:1px solid #45617c;background:linear-gradient(180deg,#163653,#0b2036);color:white;border-radius:10px;padding:9px 13px;cursor:pointer;text-decoration:none}.homeBtn:hover,.actionBtn:hover{border-color:var(--gold)}.hero{position:relative;overflow:hidden;border:1px solid #38536c;border-bottom:3px solid var(--gold);border-radius:22px;background:linear-gradient(120deg,#0b1d31 0,#102d4b 55%,#081625 100%);box-shadow:0 24px 70px #0007}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 0,#d4af3722,transparent 32%);pointer-events:none}.heroStripe{height:7px;background:linear-gradient(90deg,var(--gold),#f1dc8a,var(--gold),transparent)}.heroInner{position:relative;display:grid;grid-template-columns:170px 1fr auto;gap:24px;align-items:center;padding:28px}.avatar{width:150px;height:150px;border-radius:24px;border:2px solid var(--gold);background:radial-gradient(circle at 35% 25%,#21496e,#0a1c2f 70%);display:grid;place-items:center;box-shadow:inset 0 0 0 5px #071426,0 14px 35px #0008}.avatar span{font-weight:1000;font-size:44px}.eyebrow{color:var(--gold2);font-size:11px;letter-spacing:.18em;font-weight:900}.username{font-size:clamp(34px,6vw,64px);line-height:.95;margin:7px 0 10px;font-weight:1000;text-transform:uppercase;letter-spacing:-.045em}.meta{color:#c2ccd6;font-size:14px}.motto{margin-top:16px;color:#e3e8ee;font-style:italic;max-width:660px}.heroActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.actionBtn.gold{background:linear-gradient(180deg,#e1c15c,#b78f22);border-color:#efdb8b;color:#071426;font-weight:900}.quickStats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 22px}.stat{background:linear-gradient(180deg,#0d2239,#081726);border:1px solid var(--line);border-radius:14px;padding:17px}.stat label{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;font-weight:900}.stat b{display:block;font-size:27px;margin-top:5px}.content{display:grid;grid-template-columns:1.45fr .75fr;gap:16px}.card{background:linear-gradient(180deg,#0b2035ee,#071522ee);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 14px 40px #0004;margin-bottom:16px}.sectionTitle{display:flex;align-items:end;justify-content:space-between;gap:12px;border-bottom:1px solid #29445f;padding-bottom:10px;margin-bottom:10px}.sectionTitle h2{margin:0;font-size:18px}.sectionTitle span{color:var(--muted);font-size:11px}.playerCard{display:grid;grid-template-columns:1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid #1f3850}.playerCard:last-child{border-bottom:0}.playerTop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.playerTop b{font-size:19px}.pos{color:var(--gold2);font-weight:900}.team{color:#c4ced8;margin-top:4px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.tag{border:1px solid #3a5874;border-radius:999px;padding:4px 8px;font-size:10px;color:#c8d1da}.tag.active{border-color:#397c5e;color:#82d8a8}.tag.retired{color:#9aa8b7}.miniStats{display:grid;grid-template-columns:repeat(4,minmax(52px,1fr));gap:6px;margin-top:12px}.mini{background:#081727;border:1px solid #203c56;border-radius:9px;padding:8px;text-align:center}.mini b{display:block;font-size:16px}.mini span{display:block;color:var(--muted);font-size:9px}.trophies{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.trophy{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#2b260e,#171606);border:1px solid #9d7c24;border-radius:9px;padding:7px 9px;color:#f0d77f;font-size:11px}.legacyGrid{display:grid;gap:10px}.legacyBox{background:#081727;border:1px solid #203c56;border-radius:12px;padding:12px}.legacyBox strong{display:block;font-size:18px}.legacyBox small{color:var(--muted)}.empty{color:var(--muted);padding:18px 0}.seasonRow{padding:10px 0;border-bottom:1px solid #1d354c}.seasonRow:last-child{border-bottom:0}.seasonRow b{color:var(--gold2)}.notice{margin-top:10px;color:#b9c5d0;font-size:12px}.footer{text-align:center;color:#758495;font-size:10px;letter-spacing:.18em;padding:18px 0 28px}.error{max-width:720px;margin:80px auto;background:#281016;border:1px solid #7b303d;border-radius:16px;padding:22px}.loading{padding:80px 20px;text-align:center;color:var(--muted)}
@media(max-width:820px){.heroInner{grid-template-columns:95px 1fr}.avatar{width:90px;height:90px;border-radius:16px}.avatar span{font-size:28px}.heroActions{grid-column:1/-1;justify-content:flex-start}.quickStats{grid-template-columns:repeat(2,1fr)}.content{grid-template-columns:1fr}.playerCard{grid-template-columns:1fr}.shell{padding:10px}.brandText b{font-size:12px}.meta{font-size:12px}}
</style>
</head>
<body>
<div class="shell">
<div class="topbar"><a class="brand" href="/"><div class="brandMark">EBL</div><div class="brandText"><b>ELITE BASEBALL LEAGUE</b><span>A LEAGUE OF ITS OWN</span></div></a><a class="homeBtn" href="/">Back to EBL</a></div>
<main id="app"><div class="loading">Loading EBL profile…</div></main>
<div class="footer">PLAY • COMPETE • CONNECT • LEAVE A LEGACY</div>
</div>
<script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const qs=new URLSearchParams(location.search);
const pathParts=location.pathname.split('/').filter(Boolean);
const pathUser=pathParts[0]==='profile'&&pathParts[1]?decodeURIComponent(pathParts[1]):'';
const username=(pathUser||qs.get('u')||qs.get('user')||qs.get('username')||'').trim();
const initials=v=>String(v||'EBL').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const avg=s=>{const ab=Number(s?.AB||0),h=Number(s?.H||0);return ab?(h/ab).toFixed(3).replace(/^0/,''):'.000'};
const era=s=>{const outs=Number(s?.OUTS||0),er=Number(s?.ER||0);return outs?((er*27)/outs).toFixed(2):'0.00'};
const ip=s=>{const outs=Number(s?.OUTS||0);return `${Math.floor(outs/3)}.${outs%3}`};
let PROFILE=null,ME=null;

async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});const text=await r.text();let j={};try{j=text?JSON.parse(text):{}}catch{j={error:'BAD_RESPONSE'}}if(!r.ok)throw j;return j}

function seasonSummary(p){const s=p.stats||{};if(p.type==='P')return `<div class="miniStats"><div class="mini"><b>${s.W||0}-${s.L||0}</b><span>W-L</span></div><div class="mini"><b>${era(s)}</b><span>ERA</span></div><div class="mini"><b>${ip(s)}</b><span>IP</span></div><div class="mini"><b>${s.SO||0}</b><span>K</span></div></div>`;return `<div class="miniStats"><div class="mini"><b>${avg(s)}</b><span>AVG</span></div><div class="mini"><b>${s.HR||0}</b><span>HR</span></div><div class="mini"><b>${s.RBI||0}</b><span>RBI</span></div><div class="mini"><b>${s.SB||0}</b><span>SB</span></div></div>`}
function playerCard(p){const seasons=(p.season_history||[]).length;const trophies=(p.championships||[]).map(c=>`<span class="trophy">🏆 S${esc(c.season)} ${esc(c.team_name||c.franchise_id||'Champion')}</span>`).join('');return `<article class="playerCard"><div><div class="playerTop"><b>${esc(p.name||'Player')}</b><span class="pos">${esc(p.primary_pos||'')}</span></div><div class="team">${esc(p.team_name||p.franchise_id||'Free Agent')}</div><div class="tags"><span class="tag ${p.active?'active':'retired'}">${p.active?'ACTIVE':'FORMER'}</span><span class="tag">${p.type==='P'?'PITCHER':'POSITION PLAYER'}</span><span class="tag">${seasons} ARCHIVED SEASON${seasons===1?'':'S'}</span></div>${seasonSummary(p)}${trophies?`<div class="trophies">${trophies}</div>`:''}</div></article>`}
function archivedSeasons(players){const rows=[];for(const p of players||[]){for(const h of p.season_history||[]){const s=h.stats||{};rows.push(`<div class="seasonRow"><b>Season ${esc(h.season)}</b> • ${esc(p.name)} • ${esc(h.franchise_id||'Free Agent')}<div class="meta">${p.type==='P'?`${s.W||0}-${s.L||0} • ${era(s)} ERA • ${s.SO||0} K`:`${avg(s)} AVG • ${s.HR||0} HR • ${s.RBI||0} RBI • ${s.SB||0} SB`}</div></div>`)}}return rows.join('')}

async function addFriend(){if(!PROFILE)return;try{await api('/api/friends/request',{method:'POST',body:JSON.stringify({user_id:Number(PROFILE.profile.id)})});await load()}catch(e){alert(e.error||'Could not send friend request')}}
async function acceptFriend(){if(!PROFILE)return;try{await api('/api/friends/accept',{method:'POST',body:JSON.stringify({user_id:Number(PROFILE.profile.id)})});await load()}catch(e){alert(e.error||'Could not accept friend request')}}
async function removeFriend(){if(!PROFILE)return;try{await api('/api/friends/remove',{method:'POST',body:JSON.stringify({user_id:Number(PROFILE.profile.id)})});await load()}catch(e){alert(e.error||'Could not update friendship')}}
function messageUser(){if(!PROFILE)return;sessionStorage.setItem('eblOpenDM',String(PROFILE.profile.id));location.href='/'}

function actionButtons(j){
 const u=j.profile||{},f=j.friendship;
 if(!ME)return `<a class="actionBtn gold" href="/">Sign in to connect</a>`;
 if(j.is_self)return `<a class="actionBtn gold" href="/">My EBL Dashboard</a>`;
 let out=`<button class="actionBtn gold" onclick="messageUser()">Message</button>`;
 if(!f)out+=`<button class="actionBtn" onclick="addFriend()">Add Friend</button>`;
 else if(f.status==='PENDING'&&Number(f.addressee_user_id)===Number(ME.id))out+=`<button class="actionBtn" onclick="acceptFriend()">Accept Friend</button>`;
 else if(f.status==='PENDING')out+=`<button class="actionBtn" disabled>Request Sent</button>`;
 else if(f.status==='ACCEPTED')out+=`<button class="actionBtn" onclick="removeFriend()">Friends ✓</button>`;
 return out;
}

async function load(){
 const app=document.getElementById('app');
 if(!username){app.innerHTML='<div class="error"><h2>Profile not specified</h2><p>Use /profile/username or profile.html?u=username.</p></div>';return}
 try{
  const [j,mej]=await Promise.all([api('/api/profile/'+encodeURIComponent(username)),api('/api/me').catch(()=>({user:null}))]);
  PROFILE=j;ME=mej.user||null;
  const u=j.profile||{},players=j.players||[],current=j.current_players||[],former=j.former_players||[],champs=j.championships||[];
  const joined=u.created_at?String(u.created_at).slice(0,10):'Genesis';
  const totalArchived=players.reduce((n,p)=>n+(p.season_history||[]).length,0);
  const active=current[0],identityName=active?.name||u.username,team=active?.team_name||active?.franchise_id||'EBL Member';
  const history=archivedSeasons(players);
  const championshipMarkup=champs.map(c=>`<span class="trophy">🏆 Season ${esc(c.season)} • ${esc(c.team_name||c.franchise_id)}</span>`).join('');
  app.innerHTML=`<section class="hero"><div class="heroStripe"></div><div class="heroInner"><div class="avatar"><span>${esc(initials(identityName))}</span></div><div><div class="eyebrow">EBL MEMBER PROFILE</div><div class="username">${esc(u.username||username)}</div><div class="meta">${esc(u.role||'PLAYER')} • ${esc(team)} • Member since ${esc(joined)}</div><div class="motto">“Every season adds another line to the story.”</div></div><div class="heroActions">${actionButtons(j)}</div></div></section>
  <div class="quickStats"><div class="stat"><label>ACTIVE PLAYERS</label><b>${current.length}</b></div><div class="stat"><label>FORMER PLAYERS</label><b>${former.length}</b></div><div class="stat"><label>EBL TITLES</label><b>${champs.length}</b></div><div class="stat"><label>ARCHIVED SEASONS</label><b>${totalArchived}</b></div></div>
  <div class="content"><div><section class="card"><div class="sectionTitle"><h2>CURRENT PLAYERS</h2><span>THE ACTIVE CHAPTER</span></div>${current.length?current.map(playerCard).join(''):'<div class="empty">No active player currently attached to this account.</div>'}</section><section class="card"><div class="sectionTitle"><h2>CAREER ARCHIVE</h2><span>SEASON BY SEASON</span></div>${history||'<div class="empty">Season history will appear here as this EBL career grows.</div>'}</section><section class="card"><div class="sectionTitle"><h2>FORMER PLAYERS</h2><span>FOREVER PART OF EBL</span></div>${former.length?former.map(playerCard).join(''):'<div class="empty">No former players yet.</div>'}</section></div>
  <aside><section class="card"><div class="sectionTitle"><h2>TROPHY CASE</h2><span>CHAMPIONSHIP LEGACY</span></div><div class="trophies">${championshipMarkup||'<span class="empty">No EBL championships yet.</span>'}</div></section><section class="card"><div class="sectionTitle"><h2>LEGACY</h2><span>CAREER SNAPSHOT</span></div><div class="legacyGrid"><div class="legacyBox"><strong>${players.length}</strong><small>Total EBL Players</small></div><div class="legacyBox"><strong>${totalArchived}</strong><small>Completed Seasons</small></div><div class="legacyBox"><strong>${champs.length}</strong><small>Championships</small></div><div class="legacyBox"><strong>${esc(joined)}</strong><small>Member Since</small></div></div></section></aside></div>`;
  document.title=`${u.username||username} • EBL Profile`;
 }catch(e){app.innerHTML=`<div class="error"><h2>Couldn’t load this EBL profile</h2><p>${esc(e.error||e.message||'PROFILE_NOT_FOUND')}</p></div>`}
}
load();
</script>
</body>
</html>
